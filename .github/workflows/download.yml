name: "Smart Download: Single MP3 or ZIP"
on:
  workflow_dispatch:
    inputs:
      yt_urls:
        description: 'הדבק קישורים (מופרדים בפסיקים)'
        required: true
      format:
        description: 'mp3 או mp4'
        default: 'mp3'
        required: true

jobs:
  youtube_job:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 3. Download Videos
        run: |
          mkdir -p yt_output
          
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          FORMAT="${{ github.event.inputs.format }}"
          # פיצול הקישורים לקובץ, ניקוי רווחים ושורות ריקות
          echo "${{ github.event.inputs.yt_urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep . > urls.txt

          while IFS= read -r CLEAN_URL || [ -n "$CLEAN_URL" ]; do
            echo "Processing: $CLEAN_URL"
            
            # הוספת הגבלת אורך שם קובץ ל-100 תווים כדי למנוע שגיאות מערכת
            COMMON_ARGS="$COOKIE_ARG --ignore-errors --no-playlist --no-restrict-filenames --windows-filenames --trim-filenames 100 --extractor-args youtube:player_client=android,web --js-runtimes node"
            
            # שימוש בתבנית פלט המגבילה את אורך הכותרת ל-100 תווים
            OUTPUT_TEMPLATE="yt_output/%(title).100s.%(ext)s"

            if [ "$FORMAT" = "mp3" ]; then
              yt-dlp $COMMON_ARGS -x --audio-format mp3 --embed-thumbnail --add-metadata -o "$OUTPUT_TEMPLATE" "$CLEAN_URL" || echo "Failed to download $CLEAN_URL"
            else
              yt-dlp $COMMON_ARGS -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 --embed-thumbnail --add-metadata -o "$OUTPUT_TEMPLATE" "$CLEAN_URL" || echo "Failed to download $CLEAN_URL"
            fi
          done < urls.txt

      - name: 4. Process Output with Python (Filter & Package)
        id: process_files
        shell: python
        env:
          FILTER_CONTENT: ${{ secrets.FILTER_LIST }}
        run: |
          import os
          import shutil
          import re

          filter_content = os.environ.get('FILTER_CONTENT', '')
          bad_words = [line.strip().lower() for line in filter_content.split('\n') if line.strip()]
          
          source_dir = "yt_output"
          if not os.path.exists(source_dir) or not os.listdir(source_dir):
              print("❌ No files were downloaded. Check your URLs and Cookies.")
              exit(1)

          all_files = os.listdir(source_dir)
          files_to_process = []

          print(f"--- Starting Filter Process ({len(all_files)} files found) ---")

          for filename in all_files:
              filename_lower = filename.lower()
              found_word = None
              
              for bad_word in bad_words:
                  if bad_word in filename_lower:
                      found_word = bad_word
                      break
              
              if found_word:
                  obfuscated_word = ".".join(list(found_word))
                  print(f"❌ SKIPPING: {filename} (Found: {obfuscated_word})")
                  os.remove(os.path.join(source_dir, filename))
              else:
                  # ניקוי תווים בעייתיים נוספים
                  clean_name = re.sub(r'[;,#%&{}]', ' ', filename)
                  clean_name = clean_name[:150] # הגנה נוספת על אורך השם
                  if clean_name != filename:
                      # וידוי שאין כפילויות בשמות אחרי הקיצור
                      if os.path.exists(os.path.join(source_dir, clean_name)):
                          clean_name = "v2_" + clean_name
                      os.rename(os.path.join(source_dir, filename), os.path.join(source_dir, clean_name))
                      files_to_process.append(clean_name)
                  else:
                      files_to_process.append(filename)

          if not files_to_process:
              print("\n!!! ERROR: No valid files left after filtering !!!")
              exit(1)

          if len(files_to_process) > 1:
              os.system("zip -r -j 'collection.zip' yt_output/*")
              final_artifact = "collection.zip"
          else:
              final_artifact = files_to_process[0]
              shutil.move(os.path.join(source_dir, files_to_process[0]), final_artifact)

          print(f"\n✅ Final Artifact: {final_artifact}")
          
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"FINAL_ARTIFACT={final_artifact}\n")

      - name: 5. Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.FINAL_ARTIFACT }}"
          tag: "v${{ github.run_number }}"
          name: "הורדה מספר ${{ github.run_number }}"
          body: "ההורדה הושלמה בהצלחה! (קבצים לא תקינים או מסוננים הוסרו)"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
