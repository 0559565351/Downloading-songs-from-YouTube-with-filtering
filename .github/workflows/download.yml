name: "Smart Download: Single MP3 or ZIP"
on:
  workflow_dispatch:
    inputs:
      yt_urls:
        description: 'הדבק קישורים (מופרדים בפסיקים)'
        required: true
      format:
        description: 'mp3 או mp4'
        default: 'mp3'
        required: true
      proxy:
        description: 'פרוקסי (אופציונלי - לשימוש במקרה של חסימה גאוגרפית)'
        required: false

jobs:
  youtube_job:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg zip
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U # עדכון גרסה אחרונה

      - name: 3. Download Videos
        run: |
          mkdir -p yt_output
          
          # טיפול בעוגיות
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            echo "⚠️ No cookies found in secrets. Trying without cookies..."
            COOKIE_ARG=""
          fi

          # טיפול בפרוקסי
          if [ -n "${{ github.event.inputs.proxy }}" ]; then
            PROXY_ARG="--proxy ${{ github.event.inputs.proxy }}"
          else
            PROXY_ARG=""
          fi

          FORMAT="${{ github.event.inputs.format }}"
          echo "${{ github.event.inputs.yt_urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep . > urls.txt

          while IFS= read -r CLEAN_URL || [ -n "$CLEAN_URL" ]; do
            echo "🚀 Processing: $CLEAN_URL"
            
            # הגדרות משופרות למניעת חסימות
            # הוספנו User-Agent ו-Geo Bypass
            COMMON_ARGS="$COOKIE_ARG $PROXY_ARG --ignore-errors --no-playlist --no-restrict-filenames --windows-filenames --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' --geo-bypass"
            
            if [ "$FORMAT" = "mp3" ]; then
              yt-dlp $COMMON_ARGS -x --audio-format mp3 --embed-thumbnail --add-metadata -o "yt_output/%(title)s.%(ext)s" "$CLEAN_URL"
            else
              yt-dlp $COMMON_ARGS -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 --embed-thumbnail --add-metadata -o "yt_output/%(title)s.%(ext)s" "$CLEAN_URL"
            fi
          done < urls.txt

      - name: 4. Process Output with Python (Filter & Package)
        id: process_files
        shell: python
        env:
          FILTER_CONTENT: ${{ secrets.FILTER_LIST }}
        run: |
          import os
          import shutil
          import re
          import sys

          filter_content = os.environ.get('FILTER_CONTENT', '')
          bad_words = [line.strip().lower() for line in filter_content.split('\n') if line.strip()]
          
          source_dir = "yt_output"
          if not os.path.exists(source_dir) or not os.listdir(source_dir):
              print("❌ ERROR: No files were downloaded!")
              print("Possible reasons: Geo-blocking, Invalid Cookies, or YouTube protected video.")
              sys.exit(1)

          all_files = os.listdir(source_dir)
          files_to_process = []

          print(f"--- Starting Filter Process ({len(all_files)} files found) ---")

          for filename in all_files:
              filename_lower = filename.lower()
              found_word = next((w for w in bad_words if w in filename_lower), None)
              
              if found_word:
                  print(f"❌ SKIPPING: {filename} (Found: {'.'.join(list(found_word))})")
                  os.remove(os.path.join(source_dir, filename))
              else:
                  clean_name = re.sub(r'[;,]', ' ', filename)
                  if clean_name != filename:
                      os.rename(os.path.join(source_dir, filename), os.path.join(source_dir, clean_name))
                      files_to_process.append(clean_name)
                  else:
                      files_to_process.append(filename)

          if not files_to_process:
              print("\n!!! ERROR: All downloaded files were filtered out !!!")
              sys.exit(1)

          if len(files_to_process) > 1:
              os.system("zip -r -j 'collection.zip' yt_output/*")
              final_artifact = "collection.zip"
          else:
              final_artifact = files_to_process[0]
              shutil.move(os.path.join(source_dir, files_to_process[0]), final_artifact)

          print(f"\n✅ Final Artifact created: {final_artifact}")
          
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"FINAL_ARTIFACT={final_artifact}\n")

      - name: 5. Create Release
        uses: ncipollo/release-action@v1
        if: success()
        with:
          artifacts: "${{ env.FINAL_ARTIFACT }}"
          tag: "v${{ github.run_number }}"
          name: "Download #${{ github.run_number }}"
          body: "ההורדה הושלמה! אם חסרים קבצים, ייתכן שהם נחסמו על ידי יוטיוב או סוננו."
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
