name: "Smart Download: Single MP3 or ZIP"
on:
  workflow_dispatch:
    inputs:
      yt_urls:
        description: 'הדבק קישורים (מופרדים בפסיקים)'
        required: true
      format:
        description: 'mp3 או mp4'
        default: 'mp3'
        required: true

jobs:
  youtube_job:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          pip install yt-dlp

      - name: 3. Download Videos
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          mkdir -p yt_output
          
          # טיפול בעוגיות
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          FORMAT="${{ github.event.inputs.format }}"
          
          # פיצול הקישורים לקובץ
          echo "${{ github.event.inputs.yt_urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep . > urls.txt

          while IFS= read -r CLEAN_URL || [ -n "$CLEAN_URL" ]; do
            echo "Processing: $CLEAN_URL"
            
            # ארגומנטים למניעת חסימות (התיקון לשגיאה שלך נמצא כאן)
            # משתמש בלקוח אנדרואיד ודפדפן כדי לעקוף את ה-Signature Challenge
            COMMON_ARGS="$COOKIE_ARG --ignore-errors --no-playlist --playlist-items 1 --no-restrict-filenames --windows-filenames --trim-filenames 100 --extractor-args \"youtube:player_client=android,web\""
            
            OUTPUT_TEMPLATE="yt_output/%(title).100s.%(ext)s"

            # בדיקה אם זה קישור או חיפוש
            if [[ ! "$CLEAN_URL" =~ ^http ]]; then
               SEARCH_PREFIX="ytsearch1:"
            else
               SEARCH_PREFIX=""
            fi

            if [ "$FORMAT" = "mp3" ]; then
              yt-dlp $COMMON_ARGS -x --audio-format mp3 --audio-quality 0 --embed-thumbnail --add-metadata -o "$OUTPUT_TEMPLATE" "$SEARCH_PREFIX$CLEAN_URL"
            else
              yt-dlp $COMMON_ARGS -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 --embed-thumbnail --add-metadata -o "$OUTPUT_TEMPLATE" "$SEARCH_PREFIX$CLEAN_URL"
            fi
          done < urls.txt

      - name: 4. Process Output with Python (Filter & Package)
        id: process_files
        shell: python
        env:
          FILTER_CONTENT: ${{ secrets.FILTER_LIST }}
        run: |
          import os
          import shutil
          import re
          import zipfile

          # טעינת רשימת סינון
          filter_content = os.environ.get('FILTER_CONTENT', '')
          bad_words = [line.strip().lower() for line in filter_content.split('\n') if line.strip()]
          
          source_dir = "yt_output"
          if not os.path.exists(source_dir) or not os.listdir(source_dir):
              print("❌ No files were downloaded. Check your URLs and Cookies.")
              exit(1)

          all_files = os.listdir(source_dir)
          valid_files = []

          print(f"--- Starting Filter Process ({len(all_files)} files found) ---")

          for filename in all_files:
              filename_lower = filename.lower()
              
              # בדיקת סינון
              is_bad = False
              for bad_word in bad_words:
                  if bad_word in filename_lower:
                      print(f"❌ SKIPPING (Filtered): {filename}")
                      os.remove(os.path.join(source_dir, filename))
                      is_bad = True
                      break
              
              if not is_bad:
                  # ניקוי שם הקובץ מתווים בעייתיים
                  clean_name = re.sub(r'[\\/*?:"<>|#%&{}]', '_', filename)
                  clean_name = clean_name[:120] # הגבלת אורך
                  
                  old_path = os.path.join(source_dir, filename)
                  new_path = os.path.join(source_dir, clean_name)
                  
                  os.rename(old_path, new_path)
                  valid_files.append(clean_name)

          if not valid_files:
              print("❌ No valid files left after filtering.")
              exit(1)

          # יצירת התוצר הסופי
          if len(valid_files) > 1:
              final_artifact = "collection.zip"
              with zipfile.ZipFile(final_artifact, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for f in valid_files:
                      zipf.write(os.path.join(source_dir, f), f)
              print(f"✅ Created ZIP with {len(valid_files)} files.")
          else:
              final_artifact = valid_files[0]
              shutil.move(os.path.join(source_dir, valid_files[0]), final_artifact)
              print(f"✅ Single file ready: {final_artifact}")

          # ייצוא שם הקובץ לשלבים הבאים
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"FINAL_ARTIFACT={final_artifact}\n")

      - name: 5. Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.FINAL_ARTIFACT }}"
          tag: "v${{ github.run_number }}-${{ github.run_id }}"
          name: "הורדה מספר ${{ github.run_number }}"
          body: "ההורדה הושלמה בהצלחה! מצורף הקובץ המבוקש."
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
